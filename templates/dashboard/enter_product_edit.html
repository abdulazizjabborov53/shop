{% extends 'dashboard/base.html' %}
{% block content %}
      <div class="main-content">
        <section class="section">
          <div class="section-body">
            <div class="row">
              <div class="col-12">
                <div class="card">
                  <div class="card-header">
                    <h4>EnterProduct tahrirlash</h4>
                  </div>
                    {% if not products %}
                    <div class="alert alert-warning">
                      No products available. <a href="{% url 'd_create_product' %}">Create a product first</a>
                    </div>
                    {% endif %}
                    <form method="POST">{% csrf_token %}
          <div class="card-body">
                    <div class="form-group row mb-4">
                      <label class="col-form-label text-md-right col-12 col-md-3 col-lg-3">Product</label>
                      <div class="col-sm-12 col-md-7">
                        <select name="product" class="form-control selectric" required>
                          <option value="">Select Product</option>
                          {% for product in products %}
                          <option value="{{ product.id }}" {% if enter_product.product.id == product.id %}selected{% endif %}>{{ product.name }}</option>
                          {% endfor %}
                        </select>
                      </div>
                    </div>
                     <div class="form-group row mb-4">
                      <label class="col-form-label text-md-right col-12 col-md-3 col-lg-3">Count</label>
                      <div class="col-sm-12 col-md-7">
                        <input type="number" name="count" class="form-control" value="{{ enter_product.count }}" required>
                      </div>
                    </div>
          </div>
          <div class="card-footer text-right">
            <button class="btn btn-primary">Yangilash</button>
            <a href="{% url 'd_list_enter_product' %}" class="btn btn-secondary">Bekor qilish</a>
          </div>
                    </form>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
{% endblock %}
