<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Title -->
    <title> Digital Market Place HTML Template</title>
    <!-- Favicon -->
    <link rel="shortcut icon" href="{% static 'assets/images/logo/favicon-two.png' %}">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <!-- Fontawesome -->
    <link rel="stylesheet" href="{% static 'assets/css/fontawesome-all.min.css' %}">
    <!-- Slick -->
    <link rel="stylesheet" href="{% static 'assets/css/slick.css' %}">
    <!-- magnific popup -->
    <link rel="stylesheet" href="{% static 'assets/css/magnific-popup.css' %}">
    <!-- line awesome -->
    <link rel="stylesheet" href="{% static 'assets/css/line-awesome.min.css' %}">
    <!-- Main css -->
    <link rel="stylesheet" href="{% static 'assets/css/main.css' %}">

</head>
<body>

    <!-- ==================== Header Start Here ==================== -->
<header class="header">
    <div class="container container-full" style="margin-top: 20px; margin-bottom: 20px">
        <nav class="header-inner flx-between align-items-center">
            <!-- Logo Start -->
            <div class="logo">
                <a href="{% url 'index' %}" class="link">
                    <img src="{% static 'assets/images/logo/logo-two.png' %}" alt="Logo">
                </a>
            </div>
            <!-- Logo End  -->

            <!-- Search Form Center -->
            <div class="flex-grow-1 d-flex justify-content-center">
                <form action="{% url 'index' %}" method="get" class="d-flex" style="width: 500px;">
                    <input type="text" name="query" class="form-control" placeholder="qidirish" value="{{ request.GET.query }}">
                    <button type="submit" class="btn btn-main ms-2" style="width: 100px;">Search</button>
                </form>
            </div>

            <!-- Header Right start -->
            <div class="header-right flx-align">
    <a href="{% url 'cart' %}" class="header-right__button cart-btn position-relative">

        <img src="{% static 'assets/images/icons/cart.svg' %}" alt="">
        <span class="qty-badge font-12">0</span>
    </a>
    <div class="header-right__inner gap-3 flx-align d-lg-flex d-none">

              {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="btn btn-main pill">
        <span class="icon-left icon">
            <img src="{% static 'assets/images/icons/user.svg' %}" alt="">
        </span>Profile
    </a>
                {% else %}
                <a href="{% url 'login' %}" class="btn btn-main pill">
        <span class="icon-left icon">
            <img src="{% static 'assets/images/icons/user.svg' %}" alt="">
        </span>Login
    </a>
                {% endif %}


    <button type="button" class="toggle-mobileMenu d-lg-none"> <i class="las la-bars"></i> </button>
</div>
            <!-- Header Right End  -->
            </div>
        </nav>
    </div>
</header>
<!-- ==================== Header End Here ==================== -->


    {% block content %}
    
    {% endblock %}





<!-- ==================== Footer Start Here ==================== -->


    <!-- Jquery js -->
    <script src="{% static 'assets/js/jquery-3.7.1.min.js' %}"></script>
    <!-- Bootstrap Bundle Js -->
    <script src="{% static 'assets/js/boostrap.bundle.min.js' %}"></script>
    <!-- CountDown -->
    <script src="{% static 'assets/js/countdown.js' %}"></script>
    <!-- counter up -->
    <script src="{% static 'assets/js/counterup.min.js' %}"></script>
    <!-- Slick js -->
    <script src="{% static 'assets/js/slick.min.js' %}"></script>
    <!-- magnific popup -->
    <script src="{% static 'assets/js/jquery.magnific-popup.js' %}"></script>
    <!-- apex chart -->
    <script src="{% static 'assets/js/apexchart.js' %}"></script>

    <!-- main js -->
    <script src="{% static 'assets/js/main.js' %}"></script>

    </body>
</html>
